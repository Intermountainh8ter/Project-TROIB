<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost at sea — TROIB</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet" />
  <style>
    :root{ --abyss:#04111f; --teal:#00e0c7; --cyan:#2ad4ff; --coral:#ff7a45; --gold:#ffd166; --muted:#8fa6b2; }
    *{margin:0;box-sizing:border-box}
    body{
      min-height:100vh; display:grid; place-items:center; text-align:center;
      font-family:"Space Grotesk",sans-serif; color:#eaf4f4; padding:2rem;
      background:radial-gradient(900px 500px at 50% -10%, rgba(255,122,69,.12), transparent 60%),
                 linear-gradient(180deg,#07182a,#04111f 40%,#02080f);
    }
    .code{ font-family:"Archivo Expanded",sans-serif; font-weight:800; font-size:clamp(4rem,18vw,9rem); line-height:1;
      background:linear-gradient(176deg,#fff 0%,#e4e9f0 20%,#b3bcca 42%,#828c9b 51%,#aab3c1 60%,#e8edf3 80%,#fff 100%);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));}
    h1{ font-family:"Archivo Expanded",sans-serif; font-size:clamp(1.3rem,3vw,2rem); margin:.4rem 0 1rem; }
    p{ color:var(--muted); max-width:46ch; margin:0 auto 2rem; }
    .depth{ font-family:"Space Mono",monospace; font-size:.8rem; color:#5d7585; letter-spacing:.1em; margin-bottom:1rem; }
    a{ display:inline-flex; align-items:center; gap:.5rem; font-weight:700; color:#02080f; text-decoration:none;
      background:linear-gradient(135deg,var(--coral),var(--gold) 30%,var(--teal) 70%,var(--cyan));
      padding:.85rem 1.6rem; border-radius:100px; transition:transform .25s; }
    a:hover{ transform:translateY(-3px); }
  </style>
</head>
<body>
  <div>
    <p class="depth">DEPTH: UNKNOWN · SIGNAL LOST</p>
    <div class="code">404</div>
    <h1>This current pulled you off the map.</h1>
    <p>The page you're looking for drifted into the abyss. Let's resurface to the blueprint.</p>
    <a href="/">↑ Return to the surface</a>
  </div>
</body>
</html>
